name: Build Ore View

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Create project files
        run: |
          set -e
          cat > 'build.gradle' <<'OREVIEW_EOF_MARK'
          plugins {
              id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
          }

          group = 'com.oreview'
          version = '1.1.0'
          base { archivesName = 'oreview-forge-1.20.1' }

          java {
              toolchain.languageVersion = JavaLanguageVersion.of(17)
          }

          minecraft {
              mappings channel: 'official', version: '1.20.1'

              runs {
                  client {
                      workingDirectory project.file('run')
                      property 'forge.logging.markers', 'REGISTRIES'
                      property 'forge.logging.console.level', 'info'
                      mods {
                          oreview { source sourceSets.main }
                      }
                  }
              }
          }

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
          }

          jar.finalizedBy('reobfJar')
          OREVIEW_EOF_MARK
          cat > 'settings.gradle' <<'OREVIEW_EOF_MARK'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
              }
          }
          OREVIEW_EOF_MARK
          cat > 'gradle.properties' <<'OREVIEW_EOF_MARK'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview'
          cat > 'src/main/java/com/oreview/OreView.java' <<'OREVIEW_EOF_MARK'
          package com.oreview;

          import net.minecraftforge.fml.common.Mod;

          /**
           * Ore View: a client-side only mod. All logic lives in {@code com.oreview.client}.
           */
          @Mod(OreView.MOD_ID)
          public final class OreView {
              public static final String MOD_ID = "oreview";

              public OreView() {
              }
          }
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview/client'
          cat > 'src/main/java/com/oreview/client/ClientForgeEvents.java' <<'OREVIEW_EOF_MARK'
          package com.oreview.client;

          import com.oreview.OreView;
          import net.minecraft.client.Minecraft;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          /** Game-bus client events: opening the menu and rebuilding chunks when settings change. */
          @Mod.EventBusSubscriber(modid = OreView.MOD_ID, value = Dist.CLIENT)
          public final class ClientForgeEvents {

              private ClientForgeEvents() {
              }

              @SubscribeEvent
              public static void onClientTick(TickEvent.ClientTickEvent event) {
                  if (event.phase != TickEvent.Phase.END) {
                      return;
                  }
                  Minecraft mc = Minecraft.getInstance();
                  if (mc.level == null || mc.player == null) {
                      return;
                  }

                  while (OreKeys.MENU.consumeClick()) {
                      if (mc.screen == null) {
                          mc.setScreen(new OreMenuScreen());
                      }
                  }

                  // Chunk meshes depend on the enabled flag and the ore filter; rebuild them once after a change.
                  if (XrayState.consumeRebuildRequest()) {
                      mc.levelRenderer.allChanged();
                  }
              }
          }
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview/client'
          cat > 'src/main/java/com/oreview/client/OreFilterConfig.java' <<'OREVIEW_EOF_MARK'
          package com.oreview.client;

          import com.google.gson.Gson;
          import com.google.gson.GsonBuilder;
          import com.mojang.logging.LogUtils;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraftforge.fml.loading.FMLPaths;
          import org.slf4j.Logger;

          import java.io.IOException;
          import java.io.Reader;
          import java.io.Writer;
          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;

          /** Saves the Ore View settings to {@code config/oreview.json}. */
          public final class OreFilterConfig {
              private static final Logger LOGGER = LogUtils.getLogger();
              private static final Gson GSON = new GsonBuilder().setPrettyPrinting().create();

              private OreFilterConfig() {
              }

              private static Path file() {
                  return FMLPaths.CONFIGDIR.get().resolve("oreview.json");
              }

              public static void load() {
                  Path file = file();
                  if (!Files.isRegularFile(file)) {
                      return;
                  }
                  try (Reader reader = Files.newBufferedReader(file)) {
                      Data data = GSON.fromJson(reader, Data.class);
                      if (data == null) {
                          return;
                      }
                      XrayState.setEnabled(data.enabled);
                      XrayState.setOutlinesEnabled(data.outlines);
                      XrayState.setOutlineOpacity(data.outlineOpacity);

                      List<ResourceLocation> ids = new ArrayList<>();
                      if (data.hiddenOres != null) {
                          for (String raw : data.hiddenOres) {
                              ResourceLocation id = ResourceLocation.tryParse(raw);
                              if (id != null) {
                                  ids.add(id);
                              }
                          }
                      }
                      XrayState.setHiddenOres(ids);
                  } catch (IOException | RuntimeException e) {
                      LOGGER.warn("Ore View: could not read {}, using defaults", file, e);
                  }
              }

              public static void save() {
                  Data data = new Data();
                  data.enabled = XrayState.isEnabled();
                  data.outlines = XrayState.isOutlinesEnabled();
                  data.outlineOpacity = XrayState.outlineOpacity();
                  XrayState.hiddenOres().stream().map(ResourceLocation::toString).sorted().forEach(data.hiddenOres::add);

                  Path file = file();
                  try {
                      Files.createDirectories(file.getParent());
                      try (Writer writer = Files.newBufferedWriter(file)) {
                          GSON.toJson(data, writer);
                      }
                  } catch (IOException e) {
                      LOGGER.warn("Ore View: could not write {}", file, e);
                  }
              }

              private static final class Data {
                  boolean enabled = true;
                  boolean outlines = true;
                  int outlineOpacity = 60;
                  List<String> hiddenOres = new ArrayList<>();
              }
          }
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview/client'
          cat > 'src/main/java/com/oreview/client/OreKeys.java' <<'OREVIEW_EOF_MARK'
          package com.oreview.client;

          import com.mojang.blaze3d.platform.InputConstants;
          import net.minecraft.client.KeyMapping;
          import net.minecraftforge.client.settings.KeyConflictContext;
          import org.lwjgl.glfw.GLFW;

          public final class OreKeys {
              private static final String CATEGORY = "key.categories.oreview";

              /** Opens / closes the Ore View menu. Default: Right Shift. */
              public static final KeyMapping MENU = new KeyMapping(
                      "key.oreview.menu",
                      KeyConflictContext.IN_GAME,
                      InputConstants.Type.KEYSYM,
                      GLFW.GLFW_KEY_RIGHT_SHIFT,
                      CATEGORY);

              private OreKeys() {
              }
          }
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview/client'
          cat > 'src/main/java/com/oreview/client/OreMenuScreen.java' <<'OREVIEW_EOF_MARK'
          package com.oreview.client;

          import net.minecraft.client.gui.GuiGraphics;
          import net.minecraft.client.gui.components.Button;
          import net.minecraft.client.gui.screens.Screen;
          import net.minecraft.network.chat.Component;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.world.level.block.Block;

          import java.util.HashSet;
          import java.util.List;
          import java.util.Set;

          /**
           * Opened with Right Shift. Contains the Ore View on/off switch, the outline toggle with
           * its opacity percentage, and the per-ore show/hide list.
           */
          public class OreMenuScreen extends Screen {
              private static final int ROW_HEIGHT = 16;
              private static final int PANEL_WIDTH = 320;
              private static final int TOGGLE_HEIGHT = 20;
              private static final int ROW_VIEW_Y = 40;
              private static final int ROW_OPACITY_Y = 66;
              private static final int LIST_TOP = 96;
              private static final int BOTTOM_RESERVE = 52;
              private static final int OPACITY_STEP = 10;

              private static final int COLOR_TITLE = 0xFFFFFF;
              private static final int COLOR_TEXT = 0xDDDDDD;
              private static final int COLOR_HINT = 0xAAAAAA;
              private static final int COLOR_NAME = 0xFFFFFF;
              private static final int COLOR_ID = 0x808080;
              private static final int COLOR_SHOWN = 0xFF3CB043;
              private static final int COLOR_HIDDEN = 0xFFB03C3C;
              private static final int COLOR_HOVER = 0x33FFFFFF;
              private static final int COLOR_PANEL = 0xAA000000;
              private static final int COLOR_SWATCH_BORDER = 0xFF000000;

              private final List<Block> ores;
              private final Set<ResourceLocation> hidden;
              private int scroll;

              private int panelLeft;
              private int panelRight;
              private int listBottom;

              private Button viewButton;
              private Button outlineButton;

              public OreMenuScreen() {
                  super(Component.translatable("screen.oreview.menu.title"));
                  this.ores = XrayState.allOres();
                  this.hidden = new HashSet<>(XrayState.hiddenOres());
              }

              @Override
              protected void init() {
                  int cx = this.width / 2;
                  panelLeft = cx - PANEL_WIDTH / 2;
                  panelRight = panelLeft + PANEL_WIDTH;
                  listBottom = this.height - BOTTOM_RESERVE;

                  int half = PANEL_WIDTH / 2 - 4;
                  viewButton = addRenderableWidget(Button.builder(viewLabel(), b -> toggleView())
                          .bounds(panelLeft, ROW_VIEW_Y, half, TOGGLE_HEIGHT).build());
                  outlineButton = addRenderableWidget(Button.builder(outlineLabel(), b -> toggleOutlines())
                          .bounds(panelRight - half, ROW_VIEW_Y, half, TOGGLE_HEIGHT).build());

                  addRenderableWidget(Button.builder(Component.literal("-"), b -> changeOpacity(-OPACITY_STEP))
                          .bounds(panelLeft, ROW_OPACITY_Y, 20, TOGGLE_HEIGHT).build());
                  addRenderableWidget(Button.builder(Component.literal("+"), b -> changeOpacity(OPACITY_STEP))
                          .bounds(panelLeft + 24, ROW_OPACITY_Y, 20, TOGGLE_HEIGHT).build());

                  int buttonY = this.height - 30;
                  addRenderableWidget(Button.builder(Component.translatable("screen.oreview.menu.show_all"),
                                  b -> setAllHidden(false))
                          .bounds(cx - 154, buttonY, 100, 20).build());
                  addRenderableWidget(Button.builder(Component.translatable("screen.oreview.menu.hide_all"),
                                  b -> setAllHidden(true))
                          .bounds(cx - 50, buttonY, 100, 20).build());
                  addRenderableWidget(Button.builder(Component.translatable("gui.done"),
                                  b -> onClose())
                          .bounds(cx + 54, buttonY, 100, 20).build());

                  scroll = clamp(scroll, 0, maxScroll());
              }

              @Override
              public void render(GuiGraphics g, int mouseX, int mouseY, float partialTick) {
                  this.renderBackground(g);
                  super.render(g, mouseX, mouseY, partialTick);

                  g.drawCenteredString(this.font, this.title.getString(), this.width / 2, 10, COLOR_TITLE);
                  g.drawCenteredString(this.font, Component.translatable("screen.oreview.menu.hint").getString(),
                          this.width / 2, 24, COLOR_HINT);
                  g.drawString(this.font,
                          Component.translatable("screen.oreview.menu.opacity", XrayState.outlineOpacity()).getString(),
                          panelLeft + 50, ROW_OPACITY_Y + 6, COLOR_TEXT, false);

                  if (ores.isEmpty()) {
                      g.drawCenteredString(this.font, Component.translatable("screen.oreview.menu.none").getString(),
                              this.width / 2, LIST_TOP + 10, COLOR_HIDDEN);
                  } else {
                      drawList(g, mouseX, mouseY);
                  }

                  long shownCount = ores.stream().filter(b -> !hidden.contains(XrayState.idOf(b))).count();
                  g.drawCenteredString(this.font,
                          Component.translatable("screen.oreview.menu.count", shownCount, ores.size()).getString(),
                          this.width / 2, listBottom + 8, COLOR_HINT);
              }

              private void drawList(GuiGraphics g, int mouseX, int mouseY) {
                  g.fill(panelLeft - 2, LIST_TOP - 2, panelRight + 2, listBottom + 2, COLOR_PANEL);

                  int visible = visibleRows();
                  for (int row = 0; row < visible; row++) {
                      int index = scroll + row;
                      if (index >= ores.size()) {
                          break;
                      }
                      Block block = ores.get(index);
                      ResourceLocation id = XrayState.idOf(block);
                      int y = LIST_TOP + row * ROW_HEIGHT;

                      boolean hovered = mouseX >= panelLeft && mouseX < panelRight
                              && mouseY >= y && mouseY < y + ROW_HEIGHT;
                      if (hovered) {
                          g.fill(panelLeft, y, panelRight, y + ROW_HEIGHT, COLOR_HOVER);
                      }

                      // Checkbox: green = shown, red = hidden.
                      boolean shown = !hidden.contains(id);
                      g.fill(panelLeft + 4, y + 3, panelLeft + 14, y + 13, shown ? COLOR_SHOWN : COLOR_HIDDEN);
                      // Block color swatch, so the list matches the outlines in the world.
                      g.fill(panelLeft + 18, y + 3, panelLeft + 28, y + 13, COLOR_SWATCH_BORDER);
                      g.fill(panelLeft + 19, y + 4, panelLeft + 27, y + 12, 0xFF000000 | XrayState.colorRgb(block));

                      g.drawString(this.font, block.getName().getString(), panelLeft + 34, y + 4, COLOR_NAME, false);
                      String idText = String.valueOf(id);
                      g.drawString(this.font, idText, panelRight - 4 - this.font.width(idText), y + 4, COLOR_ID, false);
                  }
              }

              @Override
              public boolean mouseClicked(double mouseX, double mouseY, int button) {
                  if (super.mouseClicked(mouseX, mouseY, button)) {
                      return true;
                  }
                  if (button == 0 && !ores.isEmpty()
                          && mouseX >= panelLeft && mouseX < panelRight
                          && mouseY >= LIST_TOP && mouseY < LIST_TOP + visibleRows() * ROW_HEIGHT) {
                      int index = scroll + (int) ((mouseY - LIST_TOP) / ROW_HEIGHT);
                      if (index < ores.size()) {
                          toggleOre(ores.get(index));
                          return true;
                      }
                  }
                  return false;
              }

              @Override
              public boolean mouseScrolled(double mouseX, double mouseY, double delta) {
                  if (mouseX >= panelLeft && mouseX < panelRight && mouseY >= LIST_TOP && mouseY < listBottom) {
                      scroll = clamp(scroll - (int) Math.signum(delta), 0, maxScroll());
                      return true;
                  }
                  return super.mouseScrolled(mouseX, mouseY, delta);
              }

              @Override
              public boolean keyPressed(int keyCode, int scanCode, int modifiers) {
                  if (OreKeys.MENU.matches(keyCode, scanCode)) {
                      onClose();
                      return true;
                  }
                  return super.keyPressed(keyCode, scanCode, modifiers);
              }

              // ---- Actions ---------------------------------------------------------------

              private void toggleView() {
                  XrayState.setEnabled(!XrayState.isEnabled());
                  viewButton.setMessage(viewLabel());
                  OreFilterConfig.save();
              }

              private void toggleOutlines() {
                  XrayState.setOutlinesEnabled(!XrayState.isOutlinesEnabled());
                  outlineButton.setMessage(outlineLabel());
                  OreFilterConfig.save();
              }

              private void changeOpacity(int delta) {
                  XrayState.setOutlineOpacity(XrayState.outlineOpacity() + delta);
                  OreFilterConfig.save();
              }

              private void toggleOre(Block block) {
                  ResourceLocation id = XrayState.idOf(block);
                  if (!hidden.remove(id)) {
                      hidden.add(id);
                  }
                  persistOres();
              }

              private void setAllHidden(boolean hideAll) {
                  if (hideAll) {
                      for (Block block : ores) {
                          hidden.add(XrayState.idOf(block));
                      }
                  } else {
                      hidden.clear();
                  }
                  persistOres();
              }

              private void persistOres() {
                  XrayState.setHiddenOres(hidden);
                  OreFilterConfig.save();
              }

              // ---- Labels and layout -------------------------------------------------------

              private static Component viewLabel() {
                  return Component.translatable("screen.oreview.menu.ore_view", onOff(XrayState.isEnabled()));
              }

              private static Component outlineLabel() {
                  return Component.translatable("screen.oreview.menu.outlines", onOff(XrayState.isOutlinesEnabled()));
              }

              private static String onOff(boolean value) {
                  return Component.translatable(value ? "options.on" : "options.off").getString();
              }

              private int visibleRows() {
                  return Math.max(1, (listBottom - LIST_TOP) / ROW_HEIGHT);
              }

              private int maxScroll() {
                  return Math.max(0, ores.size() - visibleRows());
              }

              private static int clamp(int value, int min, int max) {
                  return Math.max(min, Math.min(max, value));
              }
          }
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview/client'
          cat > 'src/main/java/com/oreview/client/OreOutlineRenderer.java' <<'OREVIEW_EOF_MARK'
          package com.oreview.client;

          import com.mojang.blaze3d.vertex.PoseStack;
          import com.mojang.blaze3d.vertex.VertexConsumer;
          import com.oreview.OreView;
          import net.minecraft.client.Minecraft;
          import net.minecraft.client.multiplayer.ClientLevel;
          import net.minecraft.client.renderer.LevelRenderer;
          import net.minecraft.client.renderer.MultiBufferSource;
          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.RenderLevelStageEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;

          /**
           * Draws a colored wireframe around every non-visible block near the player, colored by
           * the block's map color, so you can tell what each hidden block is.
           */
          @Mod.EventBusSubscriber(modid = OreView.MOD_ID, value = Dist.CLIENT)
          public final class OreOutlineRenderer {
              /** Half-size of the scanned cube, in blocks, around the player. */
              private static final int RADIUS = 10;
              /** Slight inflation so outlines do not z-fight with neighbouring faces. */
              private static final double INFLATE = 0.003;

              private OreOutlineRenderer() {
              }

              @SubscribeEvent
              public static void onRenderLevel(RenderLevelStageEvent event) {
                  if (event.getStage() != RenderLevelStageEvent.Stage.AFTER_TRANSLUCENT_BLOCKS) {
                      return;
                  }
                  if (!XrayState.isEnabled() || !XrayState.isOutlinesEnabled() || XrayState.outlineOpacity() <= 0) {
                      return;
                  }

                  Minecraft mc = Minecraft.getInstance();
                  ClientLevel level = mc.level;
                  if (level == null || mc.player == null) {
                      return;
                  }

                  Vec3 cam = event.getCamera().getPosition();
                  float alpha = XrayState.outlineOpacity() / 100f;
                  PoseStack poseStack = event.getPoseStack();
                  MultiBufferSource.BufferSource buffers = mc.renderBuffers().bufferSource();
                  VertexConsumer lines = buffers.getBuffer(RenderType.lines());

                  poseStack.pushPose();
                  poseStack.translate(-cam.x, -cam.y, -cam.z);

                  BlockPos origin = mc.player.blockPosition();
                  BlockPos.MutableBlockPos pos = new BlockPos.MutableBlockPos();
                  for (int dx = -RADIUS; dx <= RADIUS; dx++) {
                      for (int dy = -RADIUS; dy <= RADIUS; dy++) {
                          for (int dz = -RADIUS; dz <= RADIUS; dz++) {
                              pos.set(origin.getX() + dx, origin.getY() + dy, origin.getZ() + dz);
                              BlockState state = level.getBlockState(pos);
                              if (state.isAir() || !state.getFluidState().isEmpty()) {
                                  continue;
                              }
                              if (XrayState.isVisibleOre(state) || !hasExposedFace(level, pos)) {
                                  continue;
                              }

                              int rgb = XrayState.colorRgb(state.getBlock());
                              float r = ((rgb >> 16) & 0xFF) / 255f;
                              float g = ((rgb >> 8) & 0xFF) / 255f;
                              float b = (rgb & 0xFF) / 255f;

                              double x = pos.getX();
                              double y = pos.getY();
                              double z = pos.getZ();
                              LevelRenderer.renderLineBox(poseStack, lines,
                                      x - INFLATE, y - INFLATE, z - INFLATE,
                                      x + 1 + INFLATE, y + 1 + INFLATE, z + 1 + INFLATE,
                                      r, g, b, alpha);
                          }
                      }
                  }

                  poseStack.popPose();
                  buffers.endBatch(RenderType.lines());
              }

              /** Only outline blocks that touch air or another non-solid block, which keeps the line count low. */
              private static boolean hasExposedFace(ClientLevel level, BlockPos pos) {
                  for (Direction dir : Direction.values()) {
                      BlockPos neighbor = pos.relative(dir);
                      if (!level.getBlockState(neighbor).isSolidRender(level, neighbor)) {
                          return true;
                      }
                  }
                  return false;
              }
          }
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview/client'
          cat > 'src/main/java/com/oreview/client/OreViewClient.java' <<'OREVIEW_EOF_MARK'
          package com.oreview.client;

          import com.oreview.OreView;
          import net.minecraft.client.resources.model.BakedModel;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.ModelEvent;
          import net.minecraftforge.client.event.RegisterKeyMappingsEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.event.lifecycle.FMLClientSetupEvent;
          import net.minecraftforge.registries.ForgeRegistries;

          /** Mod-bus client events: keybinds, model wrapping, config loading. */
          @Mod.EventBusSubscriber(modid = OreView.MOD_ID, bus = Mod.EventBusSubscriber.Bus.MOD, value = Dist.CLIENT)
          public final class OreViewClient {

              private OreViewClient() {
              }

              @SubscribeEvent
              public static void onClientSetup(FMLClientSetupEvent event) {
                  event.enqueueWork(OreFilterConfig::load);
              }

              @SubscribeEvent
              public static void onRegisterKeys(RegisterKeyMappingsEvent event) {
                  event.register(OreKeys.MENU);
              }

              @SubscribeEvent
              public static void onModelBake(ModelEvent.ModifyBakingResult event) {
                  event.getModels().replaceAll((id, model) ->
                          (model instanceof XrayBakedModel || !isBlockModel(id)) ? model : new XrayBakedModel(model));
              }

              private static boolean isBlockModel(ResourceLocation modelId) {
                  return ForgeRegistries.BLOCKS.containsKey(new ResourceLocation(modelId.getNamespace(), modelId.getPath()));
              }
          }
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview/client'
          cat > 'src/main/java/com/oreview/client/XrayBakedModel.java' <<'OREVIEW_EOF_MARK'
          package com.oreview.client;

          import net.minecraft.client.renderer.RenderType;
          import net.minecraft.client.renderer.block.model.BakedQuad;
          import net.minecraft.client.renderer.block.model.ItemOverrides;
          import net.minecraft.client.renderer.block.model.ItemTransforms;
          import net.minecraft.client.renderer.texture.TextureAtlasSprite;
          import net.minecraft.client.resources.model.BakedModel;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.util.RandomSource;
          import net.minecraft.world.level.BlockAndTintGetter;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraftforge.client.ChunkRenderTypeSet;
          import net.minecraftforge.client.model.data.ModelData;
          import org.jetbrains.annotations.Nullable;

          import java.util.ArrayList;
          import java.util.List;

          /**
           * Wraps every block model. While the Ore View is enabled:
           * <ul>
           *   <li>blocks that are not visible ores produce no quads, so they disappear
           *       (their outlines are drawn separately by {@link OreOutlineRenderer});</li>
           *   <li>visible ores emit all six faces without face-culling, so ores buried in
           *       stone stay visible even though the stone around them is gone.</li>
           * </ul>
           * When the Ore View is disabled every call is forwarded unchanged.
           */
          public final class XrayBakedModel implements BakedModel {
              private final BakedModel base;

              public XrayBakedModel(BakedModel base) {
                  this.base = base;
              }

              @Override
              public List<BakedQuad> getQuads(@Nullable BlockState state, @Nullable Direction side, RandomSource rand) {
                  return getQuads(state, side, rand, ModelData.EMPTY, null);
              }

              @Override
              public List<BakedQuad> getQuads(@Nullable BlockState state, @Nullable Direction side, RandomSource rand,
                                              ModelData data, @Nullable RenderType renderType) {
                  if (state == null || !XrayState.isEnabled()) {
                      return base.getQuads(state, side, rand, data, renderType);
                  }
                  if (!XrayState.isVisibleOre(state)) {
                      return List.of();
                  }
                  // Emit every face once, in the unculled (null-side) pass.
                  if (side != null) {
                      return List.of();
                  }
                  List<BakedQuad> quads = new ArrayList<>();
                  for (Direction dir : Direction.values()) {
                      for (BakedQuad quad : base.getQuads(state, dir, rand, data, renderType)) {
                          quads.add(unculled(quad));
                      }
                  }
                  quads.addAll(base.getQuads(state, null, rand, data, renderType));
                  return quads;
              }

              /** A copy of the quad that is never culled by neighbouring blocks. */
              private static BakedQuad unculled(BakedQuad quad) {
                  if (quad.getDirection() == null) {
                      return quad;
                  }
                  return new BakedQuad(quad.getVertices(), quad.getTintIndex(), null, quad.getSprite(), quad.isShade());
              }

              // ---- Forwarded properties -------------------------------------------------

              @Override
              public boolean useAmbientOcclusion() {
                  return base.useAmbientOcclusion();
              }

              @Override
              public boolean useAmbientOcclusion(BlockState state) {
                  return base.useAmbientOcclusion(state);
              }

              @Override
              public boolean isGui3d() {
                  return base.isGui3d();
              }

              @Override
              public boolean usesBlockLight() {
                  return base.usesBlockLight();
              }

              @Override
              public boolean isCustomRenderer() {
                  return base.isCustomRenderer();
              }

              @Override
              public TextureAtlasSprite getParticleIcon() {
                  return base.getParticleIcon();
              }

              @Override
              public TextureAtlasSprite getParticleIcon(ModelData data) {
                  return base.getParticleIcon(data);
              }

              @Override
              public ItemTransforms getTransforms() {
                  return base.getTransforms();
              }

              @Override
              public ItemOverrides getOverrides() {
                  return base.getOverrides();
              }

              @Override
              public ModelData getModelData(BlockAndTintGetter level, BlockPos pos, BlockState state, ModelData modelData) {
                  return base.getModelData(level, pos, state, modelData);
              }

              @Override
              public ChunkRenderTypeSet getRenderTypes(BlockState state, RandomSource rand, ModelData data) {
                  return base.getRenderTypes(state, rand, data);
              }
          }
          OREVIEW_EOF_MARK
          mkdir -p 'src/main/java/com/oreview/client'
          cat > 'src/main/java/com/oreview/client/XrayState.java' <<'OREVIEW_EOF_MARK'
          package com.oreview.client;

          import net.minecraft.core.registries.Registries;
          import net.minecraft.resources.ResourceLocation;
          import net.minecraft.tags.TagKey;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraftforge.registries.ForgeRegistries;

          import java.util.ArrayList;
          import java.util.Collection;
          import java.util.Comparator;
          import java.util.List;
          import java.util.Map;
          import java.util.Set;
          import java.util.concurrent.ConcurrentHashMap;
          import java.util.concurrent.atomic.AtomicBoolean;

          /**
           * Shared client state. Read from chunk-compile and render threads, so every field is
           * volatile and the hidden-ore set is immutable.
           */
          public final class XrayState {
              private static final TagKey<Block> FORGE_ORES =
                      TagKey.create(Registries.BLOCK, new ResourceLocation("forge", "ores"));

              private static final Map<Block, Boolean> ORE_CACHE = new ConcurrentHashMap<>();
              private static final AtomicBoolean REBUILD = new AtomicBoolean(false);

              /** Master switch: when on, non-ore blocks and hidden ores are removed from the chunk meshes. */
              private static volatile boolean enabled = true;
              /** When on, every block that is not a visible ore is drawn as a colored outline. */
              private static volatile boolean outlinesEnabled = true;
              /** Outline opacity in percent (0-100). */
              private static volatile int outlineOpacity = 60;
              private static volatile Set<ResourceLocation> hiddenOres = Set.of();

              private XrayState() {
              }

              // ---- Master switch ---------------------------------------------------------

              public static boolean isEnabled() {
                  return enabled;
              }

              public static void setEnabled(boolean value) {
                  if (enabled != value) {
                      enabled = value;
                      requestRebuild();
                  }
              }

              // ---- Outlines --------------------------------------------------------------

              public static boolean isOutlinesEnabled() {
                  return outlinesEnabled;
              }

              public static void setOutlinesEnabled(boolean value) {
                  outlinesEnabled = value;
              }

              public static int outlineOpacity() {
                  return outlineOpacity;
              }

              public static void setOutlineOpacity(int percent) {
                  outlineOpacity = Math.max(0, Math.min(100, percent));
              }

              // ---- Ore filter ------------------------------------------------------------

              public static Set<ResourceLocation> hiddenOres() {
                  return hiddenOres;
              }

              public static void setHiddenOres(Collection<ResourceLocation> ids) {
                  hiddenOres = Set.copyOf(ids);
                  requestRebuild();
              }

              // ---- Chunk rebuild requests --------------------------------------------------

              public static void requestRebuild() {
                  REBUILD.set(true);
              }

              public static boolean consumeRebuildRequest() {
                  return REBUILD.getAndSet(false);
              }

              // ---- Block classification ----------------------------------------------------

              public static ResourceLocation idOf(Block block) {
                  return ForgeRegistries.BLOCKS.getKey(block);
              }

              /** True for ores: names ending in {@code _ore}, ancient debris, or anything tagged {@code forge:ores}. */
              public static boolean isOre(Block block) {
                  return ORE_CACHE.computeIfAbsent(block, XrayState::computeIsOre);
              }

              private static boolean computeIsOre(Block block) {
                  ResourceLocation id = idOf(block);
                  if (id == null) {
                      return false;
                  }
                  String path = id.getPath();
                  return path.endsWith("_ore")
                          || path.equals("ancient_debris")
                          || block.defaultBlockState().is(FORGE_ORES);
              }

              /** An ore the player has chosen to show as solid. */
              public static boolean isVisibleOre(BlockState state) {
                  Block block = state.getBlock();
                  if (!isOre(block)) {
                      return false;
                  }
                  ResourceLocation id = idOf(block);
                  return id != null && !hiddenOres.contains(id);
              }

              /** Every ore block in the registry, sorted by id. */
              public static List<Block> allOres() {
                  List<Block> ores = new ArrayList<>();
                  for (Block block : ForgeRegistries.BLOCKS) {
                      if (isOre(block)) {
                          ores.add(block);
                      }
                  }
                  ores.sort(Comparator.comparing((Block b) -> String.valueOf(idOf(b))));
                  return ores;
              }

              /** The block's map color as 0xRRGGBB, used for outlines and list swatches. */
              public static int colorRgb(Block block) {
                  int rgb = block.defaultMapColor().col & 0xFFFFFF;
                  return rgb == 0 ? 0x9E9E9E : rgb;
              }
          }
